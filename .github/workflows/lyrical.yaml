name: lyrical

on:
  pull_request:
    branches:
      - lyrical
  push:
    branches:
      - lyrical
  schedule:
      - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-resolute-ros-lyrical-ros-base:master
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
        with:
          ref: lyrical
      - name: Install TFD
        run: |
          apt-get update && apt-get install -y git python3
          git clone https://github.com/sea-bass/TemporalFastDownward.git /tmp/tfd
          cd /tmp/tfd && ./build
          echo "TFD_HOME=/tmp/tfd/downward" >> "$GITHUB_ENV"
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: plansys2_tfd_plan_solver
          target-ros2-distro: lyrical
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - name: Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          file: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
